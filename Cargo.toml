[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"

[workspace.dependencies]
home-safe-core = { path = "crates/core" }
home-safe-server = { path = "crates/server" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures = "0.3"
gpui-kit = "0.8.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = "0.8.3"
