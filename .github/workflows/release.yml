name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml and
# extension/manifest.json) to build Home Safe.app and publish a GitHub release
# with it. Run it by hand from the Actions tab to build without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          extension_version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          echo "tag $tag, Cargo.toml $cargo_version, extension $extension_version"
          [[ "$tag" == "$cargo_version" && "$tag" == "$extension_version" ]] || {
            echo "::error::Tag v$tag doesn't match Cargo.toml ($cargo_version) and extension/manifest.json ($extension_version)"
            exit 1
          }

      # rustup reads the channel from rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      # Optional: sign with a Developer ID certificate when these secrets are
      # set (MACOS_CERTIFICATE is the base64 of a .p12). Without them the app
      # is ad-hoc signed and macOS asks people to approve it on first open.
      - name: Import signing certificate
        id: cert
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "No signing certificate; the app will be ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          echo "identity=$identity" >>"$GITHUB_OUTPUT"

      - name: Build Home Safe.app
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: scripts/bundle-macos.sh

      # Also optional: notarize when signed and these secrets are set (an
      # app-specific password for the Apple ID).
      - name: Notarize
        if: steps.cert.outputs.identity != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_ID" ]]; then
            echo "No notarization credentials; skipping."
            exit 0
          fi
          cd target/release-macos
          for dmg in *.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          done
          # Staple the app too and re-zip it, so the zip opens offline.
          xcrun stapler staple "Home Safe.app"
          rm Home-Safe-macos.zip
          ditto -c -k --keepParent "Home Safe.app" Home-Safe-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: home-safe-macos
          path: |
            target/release-macos/*.dmg
            target/release-macos/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Home Safe ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            target/release-macos/*.dmg target/release-macos/*.zip
